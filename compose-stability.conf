# Compose stability configuration.
#
# Tells the Compose compiler which types it should treat as stable, so
# composables that take them as parameters can be skipped when their
# instance is structurally unchanged.
#
# Wire from a module's `kotlinOptions { freeCompilerArgs }`:
#   "-P", "plugin:androidx.compose.compiler.plugins.kotlin:stabilityConfigurationPath=$rootDir/compose-stability.conf"
#
# See: https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file
#
# Rules: one fully-qualified type pattern per line, '*' wildcard suffix
# matches everything in that package or subpackage.

# Trakt domain models — all data classes in common are immutable by
# construction; mark the whole package stable.
tv.trakt.trakt.common.model.*
tv.trakt.trakt.common.networking.responses.*

# Resources R class types.
tv.trakt.trakt.resources.R.*

# Kotlin standard library types that hold no observable mutable state.
kotlin.time.Duration
kotlin.Result
kotlin.Pair
kotlin.Triple

# kotlinx — datetime + immutable collections are deeply immutable.
kotlinx.datetime.*
kotlinx.collections.immutable.ImmutableCollection
kotlinx.collections.immutable.ImmutableList
kotlinx.collections.immutable.ImmutableMap
kotlinx.collections.immutable.ImmutableSet
kotlinx.collections.immutable.PersistentCollection
kotlinx.collections.immutable.PersistentList
kotlinx.collections.immutable.PersistentMap
kotlinx.collections.immutable.PersistentSet

# Coil 3 image state — stable in practice, not annotated upstream.
coil3.compose.AsyncImagePainter.State

# Paging compose — exposes stable identity.
androidx.paging.compose.LazyPagingItems
