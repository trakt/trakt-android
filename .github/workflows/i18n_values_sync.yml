name: Sync strings to default

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'resources/src/main/res/values-*/strings.xml'

permissions:
  contents: read

jobs:
  sync-en-strings:
    name: Sync EN strings to values/
    runs-on: ubuntu-latest
    if: github.head_ref == 'i18n_crowdin_updates'

    steps:
      - name: Summoning the GitHub App Token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Copy values-en/strings.xml to values/
        run: cp resources/src/main/res/values-en/strings.xml resources/src/main/res/values/strings.xml

      # The Crowdin branch can lag behind main, so the script comes from the base branch.
      - name: Checkout scripts from base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.base_ref }}
          path: .base
          sparse-checkout: .github/scripts

      - name: Escape literal percent signs
        run: python3 .base/.github/scripts/escape_string_percents.py resources/src/main/res

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/src/main/res/values*/strings.xml
          git diff --staged --quiet || git commit -m "chore(i18n): sync default strings and escape literal percent signs"
          git push
