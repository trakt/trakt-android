name: Build APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Prepare build secrets
        env:
          TRAKT_API_KEY: ${{ secrets.TRAKT_API_KEY }}
          YOUNIFY_API_KEY: ${{ secrets.YOUNIFY_API_KEY }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          TRAKT_API_KEY="$TRAKT_API_KEY"
          YOUNIFY_API_KEY="$YOUNIFY_API_KEY"
          KLIPY_API_KEY="$KLIPY_API_KEY"
          KEYSTORE_ALIAS=$KEYSTORE_ALIAS
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEYSTORE_KEY_PASSWORD=$KEYSTORE_KEY_PASSWORD
          EOF

      - name: Build APK
        run: bundle exec fastlane build_apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trakt-github-arm64-${{ github.sha }}
          path: app/build/outputs/apk/internal/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Clean up secrets
        if: always()
        run: rm -f keystore.jks local.properties app/google-services.json
