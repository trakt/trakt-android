name: OpenAPI PR

on:
  push:
    branches:
      - feat/openapi_ci

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create OpenAPI sync PR
    runs-on: ubuntu-latest
    steps:
      - name: Summoning the GitHub App Token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: trakt-android
          permission-pull-requests: write

      - name: Create PR
        run: |
          gh pr create \
            --head feat/openapi_ci \
            --base main \
            --title "chore: openapi schema updates" \
            --body "Automated OpenAPI schema update." \
          || echo "PR already exists, skipping."
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
