<title>Trakt Android Releases</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky version rail on the left, one long release log on the right; the rail becomes a scrollable strip on phones. */
:root {
  --bg: #f8f7fb;
  --surface: #ffffff;
  --fg: #1a1524;
  --muted: #6a6380;
  --line: #e4e0ee;
  --accent: #6d3fd6;
  --accent-soft: #efe9fd;
  --c-new: #6d3fd6;
  --c-improved: #1f7a8c;
  --c-fixed: #b4690e;
  --c-tv: #2f7d4f;
  --c-internal: #8a84a0;
  --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #110f18; --surface: #1a1724; --fg: #ece9f6; --muted: #9c95b3; --line: #2b2739;
    --accent: #a98bff; --accent-soft: #2a2242;
    --c-new: #a98bff; --c-improved: #5cc0d4; --c-fixed: #e3a857; --c-tv: #6fc48f; --c-internal: #7d7793;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #110f18; --surface: #1a1724; --fg: #ece9f6; --muted: #9c95b3; --line: #2b2739;
  --accent: #a98bff; --accent-soft: #2a2242;
  --c-new: #a98bff; --c-improved: #5cc0d4; --c-fixed: #e3a857; --c-tv: #6fc48f; --c-internal: #7d7793;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
.page {
  max-width: 1080px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 20px 32px; align-items: end;
  padding-bottom: 20px; border-bottom: 1px solid var(--line);
}
.eyebrow { margin: 0 0 2px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 700 34px/1.1 var(--font-display); text-wrap: balance; }
.sub { margin: 6px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
#search {
  grid-column: 2; grid-row: 2; width: 100%; box-sizing: border-box; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--fg); font: inherit;
}
.top > div:first-child { grid-column: 1 / -1; }
.chips { grid-column: 1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 5px 11px;
  border-radius: 999px; font: 500 13px var(--font-body); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
:is(#search, .chip, .rail-item, .pr, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.note { margin: 16px 0 0; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 13px; }
.layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 48px; padding-top: 28px; }
.rail {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start;
  display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 32px); overflow-y: auto;
}
.rail-item {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: baseline; text-align: left;
  padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--fg); font: inherit; cursor: pointer;
}
.rail-item:hover { background: var(--accent-soft); }
.rail-month {
  margin: 14px 0 2px; padding: 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); white-space: nowrap;
}
.rail-month:first-child { margin-top: 0; }
.rv { font: 700 15px var(--font-display); font-variant-numeric: tabular-nums; }
.rd { justify-self: end; font-size: 12px; color: var(--muted); white-space: nowrap; }

#log { min-width: 0; }
.release { padding-block: 32px; border-bottom: 1px solid var(--line); scroll-margin-top: 16px; }
.release:first-child { padding-top: 0; }
.rhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.ver { margin: 0; font: 700 30px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.release.next .ver { color: var(--accent); }
.meta { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.headline { margin: 12px 0 0; font: 500 20px/1.3 var(--font-display); text-wrap: balance; }
.summary { margin: 8px 0 0; max-width: 65ch; }
.highlights { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.tile h3 { margin: 0 0 4px; font: 700 15px/1.3 var(--font-display); }
.tile p { margin: 0; font-size: 13.5px; color: var(--muted); }
.changes { margin-top: 18px; }
.changes > summary { width: fit-content; padding: 4px 0; font-size: 13px; font-weight: 600; color: var(--accent); cursor: pointer; }
.sec { margin-top: 30px; }
.changes > summary + .sec { margin-top: 20px; }
.sech {
  display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
  font: 600 12px var(--font-body); letter-spacing: .06em; text-transform: uppercase;
}
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot-new { background: var(--c-new); }
.dot-improved { background: var(--c-improved); }
.dot-fixed { background: var(--c-fixed); }
.dot-tv { background: var(--c-tv); }
.dot-internal { background: var(--c-internal); }
.count { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.items { margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 72ch; }
.items li::marker { color: var(--muted); }
.pr { color: var(--accent); text-decoration: none; font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pr:hover { text-decoration: underline; }
.state { margin: 0; padding: 24px 0; color: var(--muted); }

@media (max-width: 760px) {
  h1 { font-size: 28px; }
  .top { grid-template-columns: minmax(0, 1fr); }
  #search, .chips { grid-column: 1; grid-row: auto; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-top: 16px; }
  .rail { position: static; flex-direction: row; max-height: none; overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
  .rail-item { flex: 0 0 auto; grid-template-columns: auto; }
  .rd { justify-self: start; }
  .rail-month, .rail-month:first-child { flex: 0 0 auto; align-self: center; margin: 0 0 0 8px; padding: 0 4px; }
}
</style>

<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow">Release history</p>
      <h1>Trakt Android</h1>
      <p class="sub" id="sync">One entry per release tag</p>
    </div>
      <input id="search" type="search" placeholder="Search changes" aria-label="Search changes" autocomplete="off">
      <div class="chips" id="chips" role="group" aria-label="Filter by change type">
        <button class="chip" id="chip-all" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" id="chip-new" type="button" data-filter="new" aria-pressed="false">New</button>
        <button class="chip" id="chip-improved" type="button" data-filter="improved" aria-pressed="false">Improved</button>
        <button class="chip" id="chip-fixed" type="button" data-filter="fixed" aria-pressed="false">Fixed</button>
        <button class="chip" id="chip-tv" type="button" data-filter="tv" aria-pressed="false">TV</button>
        <button class="chip" id="chip-internal" type="button" data-filter="internal" aria-pressed="false">Under the hood</button>
      </div>
  </header>
  <p class="note" id="note" hidden>The release data can't be reached yet. Still trying.</p>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Versions"></nav>
    <main id="log"><p class="state">Loading releases...</p></main>
  </div>
</div>

<script>
(() => {
  const SECTIONS = [
    { key: "new", label: "New" },
    { key: "improved", label: "Improved" },
    { key: "fixed", label: "Fixed" },
    { key: "tv", label: "TV" },
    { key: "internal", label: "Under the hood" },
  ];
  const PR_BASE = "https://github.com/trakt/trakt-android/pull/";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const UP_NEXT = "Up Next";
  const state = { releases: [], next: null, filter: "all", query: "", open: new Set([UP_NEXT]), seeded: false, loaded: false, sync: null };

  const $ = (id) => document.getElementById(id);
  const arr = (v) => (Array.isArray(v) ? v : []);
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };
  const domId = (version) => "r-" + String(version).replace(/[^A-Za-z0-9]+/g, "-");
  const byNewest = (a, b) => (Number(b.sortKey) || 0) - (Number(a.sortKey) || 0);

  const fmtDate = (iso) => {
    const d = new Date(iso + "T00:00:00Z");
    if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  };
  const fmtPart = (iso, options) => {
    const d = new Date(iso + "T00:00:00Z");
    if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, Object.assign({ timeZone: "UTC" }, options));
  };
  const fmtDay = (iso) => fmtPart(iso, { day: "numeric", month: "short" });
  const fmtMonth = (iso) => fmtPart(iso, { month: "long", year: "numeric" });
  const gap = (r) => {
    if (!r.prev || !r.prevDate) return null;
    const days = Math.round((Date.parse(r.date) - Date.parse(r.prevDate)) / 864e5);
    if (isNaN(days)) return null;
    if (days <= 0) return "same day as " + r.prev;
    return days + (days === 1 ? " day" : " days") + " after " + r.prev;
  };

  const visibleSections = (r) =>
    SECTIONS.map((s) => {
      const source = arr(r.sections).find((x) => x && x.key === s.key);
      const items = arr(source && source.items).filter((it) => {
        if (!it || typeof it.text !== "string") return false;
        if (state.filter !== "all" && state.filter !== s.key) return false;
        if (!state.query) return true;
        return it.text.toLowerCase().includes(state.query) || arr(it.prs).some((p) => ("#" + p).includes(state.query));
      });
      return { key: s.key, label: s.label, items };
    }).filter((s) => s.items.length);

  const railItem = (r) => {
    const button = el("button", "rail-item");
    button.type = "button";
    button.append(el("span", "rv", r.version), el("span", "rd", r.upNext ? "unreleased" : fmtDay(r.date)));
    button.addEventListener("click", () => {
      const target = $(domId(r.version));
      if (target) target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    });
    return button;
  };

  const sectionNode = (s) => {
    const sec = el("section", "sec");
    const heading = el("h3", "sech");
    heading.append(el("span", "dot dot-" + s.key), document.createTextNode(s.label), el("span", "count", String(s.items.length)));
    const list = el("ul", "items");
    for (const it of s.items) {
      const li = el("li");
      li.append(el("span", "", it.text));
      for (const p of arr(it.prs)) {
        const n = parseInt(p, 10);
        if (!n) continue;
        const link = el("a", "pr", "#" + n);
        link.href = PR_BASE + n;
        link.target = "_blank";
        link.rel = "noopener";
        li.append(" ", link);
      }
      list.append(li);
    }
    sec.append(heading, list);
    return sec;
  };

  const releaseNode = (r, sections, filtering) => {
    const article = el("article", r.upNext ? "release next" : "release");
    article.id = domId(r.version);
    const head = el("header", "rhead");
    const metaParts = r.upNext
      ? [
          "Unreleased",
          r.commits + " commits since " + r.since,
          r.prs ? r.prs + " PRs" : null,
          r.asOf ? "as of " + fmtDate(r.asOf) : null,
        ]
      : [
          fmtDate(r.date),
          gap(r),
          r.commits != null ? r.commits + " commits" : null,
          r.prs ? r.prs + " PRs" : null,
        ];
    const meta = metaParts.filter(Boolean).join(" · ");
    head.append(el("h2", "ver", r.version), el("p", "meta", meta));
    article.append(head);
    if (r.headline) article.append(el("p", "headline", r.headline));

    if (!filtering) {
      if (r.summary) article.append(el("p", "summary", r.summary));
      const highlights = arr(r.highlights).filter((h) => h && h.title);
      if (highlights.length) {
        const grid = el("div", "highlights");
        for (const h of highlights) {
          const tile = el("div", "tile");
          tile.append(el("h3", "", h.title), el("p", "", h.text || ""));
          grid.append(tile);
        }
        article.append(grid);
      }
    }

    const total = sections.reduce((n, s) => n + s.items.length, 0);
    if (!total) return article;
    const details = el("details", "changes");
    details.open = filtering || state.open.has(r.version);
    details.append(el("summary", "", filtering ? total + " matching changes" : "All changes (" + total + ")"));
    for (const s of sections) details.append(sectionNode(s));
    if (!filtering) {
      details.addEventListener("toggle", () => {
        if (details.open) state.open.add(r.version);
        else state.open.delete(r.version);
      });
    }
    article.append(details);
    return article;
  };

  const syncLine = (count) => {
    const parts = [count + (count === 1 ? " release" : " releases")];
    const checked = state.sync && typeof state.sync.checkedAt === "string" ? fmtDate(state.sync.checkedAt.slice(0, 10)) : "";
    if (checked) parts.push("last checked " + checked);
    return parts.join(" · ");
  };

  const render = () => {
    const list = [...state.releases].sort(byNewest);
    const filtering = state.filter !== "all" || !!state.query;
    const entries = state.next ? [state.next, ...list] : list;
    const railFrag = document.createDocumentFragment();
    const logFrag = document.createDocumentFragment();
    let shown = 0;
    let month = "";
    for (const r of entries) {
      const sections = visibleSections(r);
      if (filtering && !sections.length) continue;
      shown += 1;
      const monthKey = r.upNext ? "" : String(r.date || "").slice(0, 7);
      if (monthKey && monthKey !== month) {
        month = monthKey;
        railFrag.append(el("p", "rail-month", fmtMonth(r.date)));
      }
      railFrag.append(railItem(r));
      logFrag.append(releaseNode(r, sections, filtering));
    }
    if (!shown) {
      const message = entries.length
        ? "No changes match this filter."
        : "No releases recorded yet. The daily sync adds an entry for each new release tag.";
      logFrag.append(el("p", "state", message));
    }
    $("rail").replaceChildren(railFrag);
    $("log").replaceChildren(logFrag);
    $("sync").textContent = syncLine(list.length);
  };

  $("search").addEventListener("input", (event) => {
    state.query = event.target.value.trim().toLowerCase();
    if (state.loaded) render();
  });
  $("chips").addEventListener("click", (event) => {
    const chip = event.target.closest("[data-filter]");
    if (!chip) return;
    state.filter = chip.dataset.filter;
    for (const other of $("chips").querySelectorAll("[data-filter]")) {
      other.setAttribute("aria-pressed", String(other === chip));
    }
    if (state.loaded) render();
  });

  const start = async () => {
    let db = null;
    try {
      db = await (window.claude && window.claude.use ? window.claude.use("db") : null);
    } catch (error) {
      db = null;
    }
    if (!db) {
      $("log").replaceChildren(el("p", "state", "Release data is not available in this view. Open the page while signed in to Claude."));
      return;
    }

    const note = $("note");
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      note.textContent = state.loaded
        ? "The release data may be out of date. Still trying to refresh."
        : "The release data can't be reached yet. Still trying.";
      note.hidden = false;
    }, 10000);
    const settle = () => {
      settled = true;
      clearTimeout(timer);
      note.hidden = true;
    };

    db.collection("releases").onSnapshot(
      (snap) => {
        state.releases = snap.docs.map((d) => Object.assign({}, d.data(), { version: d.id }));
        if (!state.seeded && state.releases.length) {
          state.seeded = true;
          state.open.add([...state.releases].sort(byNewest)[0].version);
        }
        state.loaded = true;
        render();
        if (!snap.metadata.fromCache) settle();
      },
      () => {
        settle();
        if (state.loaded) {
          note.textContent = "Live updates stopped. Reload the page to see new releases.";
          note.hidden = false;
          return;
        }
        $("log").replaceChildren(el("p", "state", "The release data could not be loaded."));
      },
    );
    db.doc("upnext/current").onSnapshot(
      (snap) => {
        const data = snap.exists ? snap.data() : null;
        state.next = data && Number(data.commits) > 0 ? Object.assign({}, data, { version: UP_NEXT, upNext: true }) : null;
        if (state.loaded) render();
      },
      () => {},
    );
    db.doc("meta/sync").onSnapshot(
      (snap) => {
        state.sync = snap.exists ? snap.data() : null;
        if (state.loaded) render();
      },
      () => {},
    );
  };

  start();
})();
</script>
